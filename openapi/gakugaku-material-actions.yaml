openapi: 3.1.0
info: {title: ガクガク教材Hub Actions, version: 1.0.0, description: 教材下書きの作成・取得・修正専用API}
servers: [{url: "https://YOUR_DOMAIN.example"}]
security: [{bearerAuth: []}]
paths:
  /api/actions/material-drafts:
    post:
      operationId: createMaterialDraft
      summary: 教材下書きを登録して一度限りのclaim URLを発行する
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateDraft'}}}}
      responses:
        '201': {description: 作成済み, content: {application/json: {schema: {$ref: '#/components/schemas/DraftResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/RateLimit'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/actions/material-drafts/{draftId}:
    get:
      operationId: getMaterialDraft
      parameters: [{$ref: '#/components/parameters/DraftId'}]
      responses: {'200': {description: 下書き}, '401': {$ref: '#/components/responses/Unauthorized'}, '500': {$ref: '#/components/responses/ServerError'}}
  /api/actions/material-drafts/{draftId}/revise:
    post:
      operationId: reviseMaterialDraft
      parameters: [{$ref: '#/components/parameters/DraftId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialDocument'}}}}
      responses: {'200': {description: 修正済み}, '401': {$ref: '#/components/responses/Unauthorized'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Unprocessable'}, '500': {$ref: '#/components/responses/ServerError'}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  parameters: {DraftId: {name: draftId, in: path, required: true, schema: {type: string, format: uuid}}}
  responses:
    BadRequest: {description: 不正なリクエスト}
    Unauthorized: {description: 認証エラー}
    Conflict: {description: 競合}
    Unprocessable: {description: 検証エラー}
    RateLimit: {description: リクエスト過多}
    ServerError: {description: サーバーエラー}
  schemas:
    DraftResponse: {type: object, additionalProperties: false, required: [draftId,status,claimUrl,expiresAt], properties: {draftId: {type: string, format: uuid}, status: {const: draft}, claimUrl: {type: string, format: uri}, expiresAt: {type: string, format: date-time}}}
    CreateDraft: {type: object, additionalProperties: false, required: [idempotencyKey,requestSummary,materialManifest,source], properties: {idempotencyKey: {type: string,minLength: 8,maxLength: 200}, requestSummary: {type: string,minLength: 1,maxLength: 2000}, source: {const: custom-gpt}, materialManifest: {$ref: '#/components/schemas/MaterialDocument'}}}
    MaterialDocument:
      type: object
      additionalProperties: false
      required: [version,metadata,presentation,pages,questions,feedbackPolicy,accessibility]
      properties:
        version: {const: 1}
        metadata: {type: object, additionalProperties: false, required: [title,grade,subject,unit,objective,difficulty], properties: {title: {type: string}, grade: {type: string}, subject: {type: string}, unit: {type: string}, objective: {type: string}, difficulty: {enum: [easy,standard,challenge]}, description: {type: string}}}
        presentation: {type: object, additionalProperties: false, required: [mode,format,pageSize], properties: {mode: {enum: [safe-composite,full-image]}, format: {enum: [simple,adventure,comic,picture-book,game-card,worksheet-poster]}, pageSize: {enum: [screen,a4-portrait,a4-landscape]}}}
        pages: {type: array, minItems: 1, items: {type: object, additionalProperties: false, required: [id,pageNumber,altText], properties: {id: {type: string}, pageNumber: {type: integer,minimum: 1}, backgroundAssetId: {type: string}, altText: {type: string,minLength: 1}}}}
        questions: {type: array, minItems: 1, items: {type: object, additionalProperties: false, required: [id,pageId,order,prompt,answerType,correctAnswer,explanation], properties: {id: {type: string}, pageId: {type: string}, order: {type: integer,minimum: 0}, prompt: {type: string}, instructions: {type: string}, answerType: {enum: [text,number,choice,multiple-choice,drawing]}, choices: {type: array,items: {type: object,additionalProperties: false,required: [id,label],properties: {id: {type: string},label: {type: string}}}}, correctAnswer: {type: string}, explanation: {type: string}, answerArea: {type: object,additionalProperties: false,required: [x,y,width,height],properties: {x: {type: number,minimum: 0,maximum: 1},y: {type: number,minimum: 0,maximum: 1},width: {type: number,exclusiveMinimum: 0,maximum: 1},height: {type: number,exclusiveMinimum: 0,maximum: 1}}}}}}
        feedbackPolicy: {type: object,additionalProperties: false,required: [tone,revealAnswer,allowHints],properties: {tone: {enum: [gentle,standard,detailed]},revealAnswer: {type: boolean},allowHints: {type: boolean},maxHints: {type: integer,minimum: 0}}}
        accessibility: {type: object,additionalProperties: false,required: [highContrast,largeText,readingSupport,imageDescription],properties: {highContrast: {type: boolean},largeText: {type: boolean},readingSupport: {type: boolean},imageDescription: {type: string,minLength: 1}}}
